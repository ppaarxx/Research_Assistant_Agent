services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-assistant-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: research-assistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Parth@321
      POSTGRES_DB: research_assistant_agent
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_assistant_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
